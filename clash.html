<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale - Harmonia Sonora</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="shortcut icon" href="./assets/images/favicon-game.ico" type="image/x-icon">
</head>

<body>
    <main>
        <section class="tela ativa">
            <a href="./index.html" class="voltar">Voltar</a>
            <h2>SONS DE CLASH ROYALE</h2>
            <img id="imagem-clash"class="imagem"src="./assets/images/clash-heheheha.png"alt="Heheheha">

            <div class="teclado">
                <button class="tecla" data-som="clash-heheheha" data-imagem="./assets/images/clash-heheheha.png" data-nome="Heheheha" onclick="tocarSom(this, 'imagem-clash')">Heheheha</button>
                <button class="tecla" data-som="clash-corredor" data-imagem="./assets/images/clash-corredor.png" data-nome="Corredor" onclick="tocarSom(this, 'imagem-clash')">Corredor</button>
                <button class="tecla" data-som="clash-intro" data-imagem="./assets/images/clash-intro.png" data-nome="Intro" onclick="tocarSom(this, 'imagem-clash')">Intro</button>
                <button class="tecla" data-som="clash-mimimi" data-imagem="./assets/images/clash-mimimi.png" data-nome="Mimimi" onclick="tocarSom(this, 'imagem-clash')">Mimimi</button>
                <button class="tecla" data-som="clash-mega-cavaleiro" data-imagem="./assets/images/clash-mega-cavaleiro.png" data-nome="Mega Cavaleiro" onclick="tocarSom(this, 'imagem-clash')">Mega Cavaleiro</button>
                <button class="tecla" data-som="clash-mini-pekka" data-imagem="./assets/images/clash-mini-pekka.png" data-nome="Mini Pekka" onclick="tocarSom(this, 'imagem-clash')">Mini Pekka</button>
            </div>
            
        </section>
    </main>

    <script src="./script/app.js"></script>
</body>
</html>
